name: Akio Proactive LINE

on:
  workflow_dispatch:
  schedule:
    # 毎時17分（日本時間）。毎回LINEするのではなく、
    # Render側で「あきおが今送るか」を判定する。
    - cron: "17 * * * *"
      timezone: "Asia/Tokyo"

jobs:
  proactive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wake Akio and run proactive check
        env:
          AKIO_PROACTIVE_URL: ${{ secrets.AKIO_PROACTIVE_URL }}
          PROACTIVE_SECRET: ${{ secrets.PROACTIVE_SECRET }}
        run: |
          curl --fail-with-body \
            --show-error \
            --silent \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 180 \
            -X POST \
            -H "Authorization: Bearer ${PROACTIVE_SECRET}" \
            "${AKIO_PROACTIVE_URL}"
